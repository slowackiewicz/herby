<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Miasta i herby</title>
    <style>
    table {
        border-collapse: collapse;
    }

    td {
        border: 1px solid black;
        padding: 5px;
    }

    img {
        width: 250px;   /* jednakowa szerokość */
        height: 200px;  /* jednakowa wysokość */
        object-fit: contain; /* zachowuje proporcje herbu */
    }
    </style>
</head>
<body>

<h1>Miasta i herby</h1>

<table border="1">
    <tr>
        <td>Kraków</td>
        <td><img src="krakow.svg.webp" alt="Herb Krakowa"></td>
    </tr>
    <tr>
        <td>Bogucice</td>
        <td><img src="bogucice.svg.webp" alt="Herb Bogucic"></td>
    </tr>
    <tr>
        <td>Żędowice</td>
        <td><img src="zedowice.jpeg" alt="Herb Żędowic"></td>
    </tr>
    <tr>
        <td>Katowice</td>
        <td><img src="katowice.svg.webp" alt="Herb Katowic"></td>
    </tr>
</table>

</body>
</html>
